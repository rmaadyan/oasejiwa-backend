name: Deploy Backend to VPS (SSH)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/oasejiwa-backend

            git fetch origin main
            git reset --hard origin/main

            # Start database container if not running
            docker compose up -d postgres || true

            # Rebuild & Restart Docker Container
            docker compose up -d --build app

            # Run Prisma DB Sync inside container
            docker compose exec -T app npx prisma db push --accept-data-loss || true

            docker image prune -f