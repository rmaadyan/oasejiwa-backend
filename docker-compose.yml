version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: oase_db
    restart: always
    environment:
      POSTGRES_USER: oasejiwa
      POSTGRES_PASSWORD: sosok_menginspirasi
      POSTGRES_DB: oase_jiwa_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: oase_backend
    restart: always
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://oasejiwa:sosok_menginspirasi@postgres:5432/oase_jiwa_db?schema=public
      PORT: 3000
    depends_on:
      - postgres

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/var/data

volumes:
  postgres_data:
  portainer_data: